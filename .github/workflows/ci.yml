name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make lint-guard-test
      - run: make test
      - run: make installer-check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Boot dev infra (postgres + redpanda)
        run: |
          sed -e "s/replace-me/$(openssl rand -hex 16)/g" deploy/env.example > deploy/.env
          docker compose -f deploy/docker-compose.yaml -f deploy/compose.override.yaml up -d --wait postgres redpanda
          docker compose -f deploy/docker-compose.yaml -f deploy/compose.override.yaml run --rm redpanda-setup
      - name: Integration tests
        run: make test-integration

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Unit tests and production build
        run: |
          cd apps/web
          npm ci
          # The tsconfig extends ./.nuxt/tsconfig.json, which only a
          # prepare (or a dev run) generates; without it every suite
          # fails to collect ("no tests").
          npx nuxt prepare
          npm test
          npm run build

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/admin/.nvmrc
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Unit tests and production build
        run: |
          cd apps/admin
          npm ci
          # The tsconfig extends ./.nuxt/tsconfig.json, which only a
          # prepare (or a dev run) generates; without it every suite
          # fails to collect ("no tests").
          npx nuxt prepare
          npm test
          npm run build

  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the service images (Go services + the admin app)
        run: cd deploy && docker compose -f docker-compose.yaml build

  test-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot test profile (simnet btcd/ltcd + EVM devnet)
        run: |
          sed -e "s/replace-me/$(openssl rand -hex 16)/g" deploy/env.example > deploy/.env
          docker compose -f deploy/docker-compose.yaml -f deploy/compose.test.yaml --profile test up -d --wait postgres redpanda btcd ltcd anvil
          docker compose -f deploy/docker-compose.yaml -f deploy/compose.test.yaml run --rm redpanda-setup
      - name: Probe the chain RPC endpoints
        run: make test-profile-probe
      - name: SASL is enforced
        run: |
          docker compose -f deploy/docker-compose.yaml exec -T redpanda \
            rpk topic list 2>&1 | grep -q "SASL is required"
      - name: Chain E2E (ltcd seam still t.Skip'd in btc/e2e_test.go; EVM unskipped by #27)
        run: make test-chain-e2e

  admin-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/admin/.nvmrc
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Env file and Playwright browser
        run: |
          sed -e "s/replace-me/$(openssl rand -hex 16)/g" deploy/env.example > deploy/.env
          cd apps/admin
          npm ci
          npx playwright install --with-deps chromium
      - name: Admin E2E over the compose stack (fresh database every run)
        run: make admin-e2e

  # Security scanning (audit issue #92): govulncheck fails the build on
  # vulnerabilities reachable from this module's own call graph; trivy
  # fails on CRITICAL/HIGH fixable findings in the dependency/config
  # tree. Unfixed-elsewhere findings stay visible in the report but do
  # not gate (nothing to fix by bumping; track them in issues instead).
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Reachable vulnerabilities fail the build
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency and config scan (CRITICAL/HIGH fail)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.76.1 fs \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 /repo
